<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>Rider Order Detail Screen (Korean)</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="container">
    <p><a href="index.html">&larr; Back to Cover</a></p>
    <h1>Rider Order Detail Screen (Korean)</h1>
    
    <div class="states-grid">
      <!-- Default State -->
      <div class="state-column">
        <div class="state-title">Default State</div>
        <div class="phone-frame">
          <div class="phone-header">
            <span class="logo">Lieferoo</span>
            <span>배달 상세 정보</span>
          </div>
          <div class="phone-content">
            <div class="card">
              <h3>배달지 주소</h3>
              <p><strong>서울특별시 마포구 동교로51길 10</strong></p>
              <p>한빛마을2단지아파트 101호</p>
            </div>
            <div class="card">
              <h3>라이더 요청사항</h3>
              <p>문 앞에 두고 벨 눌러주세요</p>
            </div>
            <button class="btn-primary">배달 완료</button>
          </div>
        </div>
      </div>

      <!-- Empty State -->
      <div class="state-column">
        <div class="state-title">Empty State</div>
        <div class="phone-frame">
          <div class="phone-header">
            <span class="logo">Lieferoo</span>
            <span>배달 상세 정보</span>
          </div>
          <div class="phone-content">
            <p style="text-align: center; margin-top: 40px;">할당된 배달건이 없습니다.</p>
          </div>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
